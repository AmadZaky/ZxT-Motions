name: Publish ZxT-Motions Official Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: motionastra-release
  cancel-in-progress: false
env:
  PYTHONUTF8: "1"
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  installer-tests:
    runs-on: windows-latest
    steps:
      - name: Get exact source revision
        shell: bash
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify Windows installer
        shell: powershell
        run: ./tests/installers-windows.ps1
      - name: Build Windows graphical installer
        shell: powershell
        run: ./tools/build-windows-installer.ps1
      - name: Verify Windows graphical workflow
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -File ./tests/installer-ui-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -STA -File ./tests/installer-window-windows.ps1
      - name: Verify online setup
        shell: powershell
        run: ./tests/online-installer-windows.ps1
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/Install ZxT-Motions.exe
            dist/installer-preview.png
          if-no-files-found: error
  release:
    needs: installer-tests
    runs-on: windows-latest
    steps:
      - name: Get exact source revision
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${SOURCE_REPO}.git"
          git fetch --depth=2 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Verify patch version
        run: python tools/check-version.py
      - name: Verify ExtendScript compatibility and packaging
        run: |
          npm install --no-save --package-lock=false acorn@8.15.0
          node tests/es3.cjs
          python tests/package.py
          python tests/official-release.py
      - name: Verify host tests
        run: |
          for test in static engine expressions bridge tools create-tools font-sources checkboxes parser-boundary update-target background-create fx-target panel-state background-stability preview-idle loop-modes background-colors loop-migration features-282 compact-controls switcher-choice yu-text motion-curve fx-tools module-isolation smart-apply bridge-lifecycle glass-surface fxtools-native-contract selection-context animation-preservation collections official-collections transform-motion; do
            node "tests/$test.cjs"
          done
      - name: Verify browser workflow
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          node tests/reliability-ui.cjs
          node tests/official-cleanup-ui.cjs
          node tests/transform-motion-ui.cjs
          node tests/studio-ui.cjs
          node tests/studio-binding.cjs
          node tests/studio-workflow-ui.cjs
          node tests/ui.cjs
          node tests/checkbox-ui.cjs
          node tests/tweaker-ui.cjs
          node tests/yu-ui.cjs
          node tests/curve-ui.cjs
          node tests/font-search-ui.cjs
          node tests/global-search-ui.cjs
          node tests/switcher-choice-ui.cjs
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Package extension
        run: python tools/package-release.py --windows-launcher "dist/Install ZxT-Motions.exe"
      - name: Publish Official Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          asset="ZxT-Motions_v${version}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
            test "$existing" = "$SOURCE_SHA"
            gh release upload "$tag" "$asset" "dist/Install ZxT-Motions.exe" --clobber
          else
            gh release create "$tag" "$asset" "dist/Install ZxT-Motions.exe" --target "$SOURCE_SHA" \
              --title "ZxT-Motions v${version} — Official Release" --latest --notes-file RELEASE_NOTES.md
          fi
